<!DOCTYPE html>
<html>
<head> 
    <title>focus timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>focus time</h1>

<h2>Focus Duration</h2>

<div id="durations">
    <button id="15">15 min </button>
    <button id="25">25 min </button>
    <button id="45">45 min </button>
    <button id="60">60 min </button>
</div>

<h2>Break Duration</h2>

<div id="break-durations">
<button id="break5">5 min</button>
<button id="break10">10 min</button>
<button id="break15">15 min</button>
</div>

<div id="timer-card"> 
<div id="mode"> Focus Time</div>
<div id="timer">25:00</div>

<button id="start">start</button>
<button id="pause">pause</button>
<button id="reset">reset</button>
</div>

<div id="stats">

<div id="sessions">sessions: 0/4</div>
<div id="goal">Daily goal: 4 sessions</div>

</div>

<label for="goalInput">daily goal:</label>
<input type="number" id="goalInput" min="1" max="20" value="4">
<button id="setGoal">set Goal</button>
<button id="beginAgain">Begin Again</button>

<script src="script.js"></script>
</body>
</html>
